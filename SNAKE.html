<!DOCTYPE html>
<html>
<head>
  <title>PLAY SNAKE!!</title>
</head>
<body>
  <h1>snake!!!</h1>
  <p><a href="index.html">back to home :)</a></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
 
    var snake = { x: 5, y: 5 };
 
function drawBoard() {
  ctx.fillStyle = "#91ad8f";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "black";
  ctx.fillRect(snake.x, snake.y, 20, 20);
}
setInterval(step, 100);
    function step() {
  snake.x = snake.x + 20;
 
  if (snake.x > 380) {
    snake.x = 0;
  }
 
  drawBoard();
}


  drawBoard();
  </script>

</body>
</html>
